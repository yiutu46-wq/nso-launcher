name: Windows launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build-sign-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Install Pillow
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build launcher (unsigned)
        shell: pwsh
        run: ./build.ps1

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v6
        with:
          name: launcher-unsigned
          path: dist/NinjaSagaPvP-Launcher.exe
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nso-launcher
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: launcher
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signature
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter NinjaSagaPvP-Launcher.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró el EXE firmado" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName verify /pa /v $exe.FullName
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, StatusMessage, SignerCertificate

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem signed -Recurse -Filter NinjaSagaPvP-Launcher.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-Item dist/NinjaSagaPvP-Launcher.exe }
          Copy-Item $exe.FullName release/NinjaSagaPvP-Launcher.exe -Force
          $hash = (Get-FileHash release/NinjaSagaPvP-Launcher.exe -Algorithm SHA256).Hash
          "$hash  NinjaSagaPvP-Launcher.exe" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload final artifact
        uses: actions/upload-artifact@v6
        with:
          name: launcher
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
